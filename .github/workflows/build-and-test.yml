
name: Build and test core

on:
  pull_request:
    branches: [ core ]
  push:
    branches: [ core ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web-terminal:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout core
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Check formatting
        working-directory: web
        run: npm run format:check

      - name: Build (includes typecheck)
        working-directory: web
        run: npm run build

      - name: Fail if the committed bundle is stale
        run: |
          if ! git diff --quiet -- src/main/resources/assets example_website/login.html; then
            echo "::error::src/main/resources/assets or example_website/login.html is out of date - run 'npm run build' in core/web and commit the result."
            git diff -- src/main/resources/assets example_website/login.html
            exit 1
          fi

  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout core
        uses: actions/checkout@v4

      - name: Test core pin updater
        run: python3 -m unittest discover -s .github/scripts/tests -p 'test_*.py' -v

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build and test core
        run: ./gradlew --build-cache --info --stacktrace build
